[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nanobuilder"
version = "0.1.0"
description = "Crystal + ligand nanostructure builder with HOOMD-blue and LAMMPS exports (nanoHUB tool xtalligand)"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
  {name = "Christina Bayard"},
  {name = "Merve Fedai"},
  {name = "Deepak Sai Pendyala"},
  {name = "Andrew Cannon"},
  {name = "Patrick Hogsed"},
  {name = "Sergei Rigin"},
]
classifiers = ["License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3.12"]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "ase>=3.23",
  "rdkit>=2023.9",
  "gsd>=3.0",
  "ipywidgets>=7.6",
  "spglib>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "notebook>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nanobuilder = ["material_presets.json", "assets/*.png", "assets/fonts/*", "data/materials_project/*.cif",
               "data/materials_project/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
  # ASE 3.29 sets ndarray.shape, which NumPy 2.5 deprecates; harmless for now.
  "ignore:Setting the shape on a NumPy array:DeprecationWarning",
]
